# Snoomp — production deployment (Linux host)
#
# The frontend is baked into the backend image and served same-origin, so
# there is no separate frontend service, no Node on the host, and no way for
# the UI and API to drift out of sync: the image tag is the whole artifact.
#
#   cp .env.example .env && $EDITOR .env     # JWT_SECRET and POSTGRES_PASSWORD are required
#   docker compose up -d --build
#
# Update:   docker compose build && docker compose up -d
# Rollback: docker compose down && git checkout <tag> && docker compose up -d --build

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: snoomp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-snoomp_admin}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
      POSTGRES_DB: "${POSTGRES_DB:-snoomp_db}"
    volumes:
      - db_data:/var/lib/postgresql/data
    # Not published to the host — only the app containers need it. Uncomment
    # to attach a SQL client from outside.
    # ports:
    #   - "127.0.0.1:54321:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-snoomp_admin} -d ${POSTGRES_DB:-snoomp_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: snoomp-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: snoomp:${SNOOMP_VERSION:-local}
    container_name: snoomp-api
    restart: unless-stopped
    environment: &app_env
      DATABASE_URL: "postgresql://${POSTGRES_USER:-snoomp_admin}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:-snoomp_db}"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set in .env - generate with openssl rand -base64 48}"
      ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:8008}"
      SNOOMP_ADMIN_PASSWORD: "${SNOOMP_ADMIN_PASSWORD:-}"
    ports:
      - "${SNOOMP_BIND_IP:-0.0.0.0}:${SNOOMP_PORT:-8008}:8000"
    # ICMP raw sockets. The container still runs as non-root; this grants the
    # one capability the ping checker needs rather than the whole root set.
    cap_add:
      - NET_RAW
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: &logging
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  worker:
    # ponytail: reuse image built by api service to avoid duplicate multi-stage build overhead
    image: snoomp:${SNOOMP_VERSION:-local}
    container_name: snoomp-worker
    restart: unless-stopped
    command: ["celery", "-A", "worker.tasks", "worker", "--loglevel=info", "--concurrency=${CELERY_CONCURRENCY:-8}"]
    environment: *app_env
    # The worker executes every check — ping, SNMP, SSH, TCP, DNS — so it needs
    # the same network capability as the API.
    cap_add:
      - NET_RAW
    depends_on:
      api:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # ponytail: the image's baked HTTP healthcheck checks port 8000 (api only); disable on worker
    healthcheck:
      disable: true
    logging: *logging

volumes:
  db_data:
  redis_data:
