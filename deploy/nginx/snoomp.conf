# ==============================================================================
# Snoomp — Production Nginx Reverse Proxy Configuration
# ==============================================================================
# Place in /etc/nginx/sites-available/snoomp.conf and link to sites-enabled.
# Adjust 'server_name' and SSL certificate paths for your environment.
# ==============================================================================

# Connection upgrade mapping for real-time WebSockets
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream snoomp_backend {
    server 127.0.0.1:8008;
    keepalive 32;
}

# HTTP — Redirect all traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name snoomp.example.com;

    # Let's Encrypt / Certbot challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Main Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name snoomp.example.com;

    # SSL Certificates (managed via certbot or custom certs)
    # ssl_certificate /etc/letsencrypt/live/snoomp.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/snoomp.example.com/privkey.pem;

    # Strong SSL Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Max body size for database backups and PDF report generation
    client_max_body_size 120M;

    # Main Application Proxy
    location / {
        proxy_pass http://snoomp_backend;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket Support (Required for real-time dashboard telemetry)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Long-lived WebSocket timeouts (prevent disconnects after 60s idle)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Buffering settings
        proxy_buffering off;
    }
}
