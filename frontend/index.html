    <script>
      (function() {
        try {
          var t = localStorage.getItem('snoomp_theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', t);
          if (t === 'light') {
            document.documentElement.style.backgroundColor = '#F4F6F8';
            document.documentElement.style.color = '#181A1C';
          } else {
            document.documentElement.style.backgroundColor = '#0c0d12';
            document.documentElement.style.color = '#f4f5fb';
          }
        } catch(e) {}
      })();
    </script>
    <style>
      /* Prevent flash during loading */
      html, body {

      }
    </style>
